name: Feature Request
description: Suggest a new feature or folder pattern
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **use case** first — especially folder layout or PPTX output needs.
        [Contributing](../CONTRIBUTING.md)

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What workflow is painful today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional

  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: Folder scanner
        - label: PPTX layout / slides
        - label: UI / themes
        - label: Portable build
        - label: Documentation
